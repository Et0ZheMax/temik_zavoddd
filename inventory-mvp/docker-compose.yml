services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/inventory_mvp
      SECRET_KEY: super-secret-key
      CORS_ORIGINS: http://localhost:4456
    depends_on:
      - db
    ports:
      - "8008:8000"
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4456:4456"
    environment:
      - VITE_API_URL=http://localhost:8008/api

volumes:
  pgdata:
